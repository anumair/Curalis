services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: curalis
      POSTGRES_PASSWORD: curalis
      POSTGRES_DB: curalis
    ports:
      - "5432:5432"
    volumes:
      - curalis_pgdata:/var/lib/postgresql/data

volumes:
  curalis_pgdata:
